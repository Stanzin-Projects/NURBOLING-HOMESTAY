<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7CC95A"/>
      <stop offset="100%" stop-color="#2F7A4F"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8B84B"/>
      <stop offset="100%" stop-color="#C98F2B"/>
    </linearGradient>
  </defs>

  <!-- outer eco ring -->
  <circle cx="60" cy="60" r="56" fill="#10352A"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="url(#leafGrad)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#E8B84B" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- mountains behind -->
  <path d="M22 74 L42 46 L56 64 L68 50 L98 74 Z" fill="#1C5743"/>
  <path d="M42 46 L50 57 L45 60 L38 54 Z" fill="#2F7A4F"/>

  <!-- house -->
  <path d="M36 66 L60 46 L84 66 L84 70 L60 51 L36 70 Z" fill="url(#roofGrad)"/>
  <rect x="45" y="66" width="30" height="22" rx="3" fill="#F5EFE2"/>
  <rect x="56" y="76" width="8" height="12" rx="1.5" fill="#2F7A4F"/>
  <rect x="48" y="70" width="6" height="6" rx="1" fill="#7CC95A"/>
  <rect x="66" y="70" width="6" height="6" rx="1" fill="#7CC95A"/>

  <!-- sprouting leaf on roof -->
  <path d="M60 44 C60 34 66 28 74 27 C74 36 69 43 60 44 Z" fill="url(#leafGrad)"/>
  <path d="M60 44 C60 38 63 32 71 28" fill="none" stroke="#10352A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- ground line -->
  <path d="M30 88 Q60 94 90 88" fill="none" stroke="#7CC95A" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- wordmark -->
  <text x="60" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="bold" fill="#E8B84B" letter-spacing="1.5">NURBOLING</text>
</svg>
